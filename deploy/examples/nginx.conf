# Reference ONLY — not applied by this repository.
# Production TLS ingress for account-onboarding. Terminate TLS here and proxy to
# the loopback app (127.0.0.1:8788). Do not expose 8788 directly.
#
# TLS: obtain certs via certbot (ACME) with auto-renew, or an internal CA in a
# private network. TLS1.2+ only; HSTS after verification.
server {
    listen 443 ssl http2;
    server_name onboarding.example.com;

    ssl_certificate     /etc/letsencrypt/live/onboarding.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onboarding.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Never forward client-supplied Forwarded / X-Real-IP.
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_buffering off;
    }

    access_log /var/log/nginx/onboarding.access.log;
    error_log  /var/log/nginx/onboarding.error.log warn;
}

# Redirect HTTP to HTTPS.
server {
    listen 80;
    server_name onboarding.example.com;
    return 301 https://$host$request_uri;
}
