# Server-side compose for the v0.1 sandbox instance.
#
# Secrets are NOT injected here. The operator provisions them once under
#   <DIR>/secrets-src/onboarding_master_key   (0444, root-owned source projection)
#   <DIR>/secrets-src/onboard_admin_token     (0444)
# and remote-deploy.sh materializes them into <DIR>/secrets (0700, 10001:10001)
# with scripts/materialize_secrets.sh before the service starts, because the
# service refuses anything that is not a regular 0400/0600 file it owns.
services:
  onboardd:
    image: "${IMAGE_REPO}:${IMAGE_TAG}"
    container_name: "${CONTAINER_NAME}"
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      # Loopback only: the host already runs other services and its own ingress.
      # Put your reverse proxy in front of 127.0.0.1:${HOST_PORT} for TLS.
      - "127.0.0.1:${HOST_PORT}:8788"
    environment:
      ONBOARD_LISTEN: "0.0.0.0:8788"
      ONBOARD_ALLOW_PUBLIC_LISTEN: "1"
      ONBOARD_DB_PATH: "/app/data/state.sqlite"
      ONBOARD_MODE: "sandbox"
      ONBOARD_MAX_CONCURRENCY: "2"
      ONBOARD_LOG_LEVEL: "info"
      ONBOARD_MASTER_KEY_FILE: "/run/secrets/onboarding_master_key"
      ONBOARD_ADMIN_TOKEN_FILE: "/run/secrets/onboard_admin_token"
      ONBOARD_DOMAINS: "${ONBOARD_DOMAINS:-moonbyte.test}"
      # v0.1 is a sandbox: no live provider is configured or authorized.
      ONBOARD_FAKE_PROVIDERS: "true"
      ONBOARD_CLOUDFLARE_ENABLED: "false"
      ONBOARD_GITHUB_ENABLED: "false"
      ONBOARD_WORKBUDDY_ENABLED: "false"
      ONBOARD_KEYCLOAK_ENABLED: "false"
      ONBOARD_MAILPIT_ENABLED: "false"
      ONBOARD_OIDC_ENABLED: "false"
    volumes:
      - "${HOST_DIR}/data:/app/data"
      - "${HOST_DIR}/secrets:/run/secrets:ro"
    healthcheck:
      test: ["CMD", "/app/onboardd", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
