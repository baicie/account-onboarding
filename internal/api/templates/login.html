{{define "content"}}
<section class="narrow">
  <h1>{{T "login.title"}}</h1>
  <p class="muted">{{T "login.hint"}}</p>
  <form method="post" action="/ui/login" class="card">
    <label for="token">{{T "login.token_label"}}</label>
    <input type="password" id="token" name="token" autocomplete="current-password" required>
    <button type="submit">{{T "login.submit"}}</button>
  </form>
  <p class="muted small">{{T "login.session_note"}}</p>
</section>
{{end}}
