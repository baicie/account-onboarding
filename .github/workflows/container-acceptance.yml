# Manual-only container acceptance (R7). No push trigger, no deployment, no
# registry publish, no third-party platform credentials. Runs on a GitHub-hosted
# Ubuntu runner with the runner's Docker daemon.
name: container-acceptance
on:
  workflow_dispatch:
concurrency:
  group: container-acceptance
  cancel-in-progress: false
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/container-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
      - name: Offline gates
        run: make verify
      - name: Docker acceptance script self-test (no daemon needed)
        shell: bash
        run: |
          set -euo pipefail
          bash tests/r51/docker_acceptance.sh --self-test | tee self-test.log
          grep -qE '^SUMMARY pass=[0-9]+ fail=0 mode=self-test' self-test.log
      - name: Docker environment evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            docker version
            docker info
            docker compose version
          } > "$EVIDENCE_DIR/docker-environment.txt" 2>&1
          docker compose -f deploy/compose.yaml config > "$EVIDENCE_DIR/compose-config.yaml"
          cat "$EVIDENCE_DIR/docker-environment.txt"
      - name: Docker runtime acceptance (isolated project/ports/data)
        shell: bash
        env:
          R51_EVIDENCE_DIR: ${{ github.workspace }}/container-evidence
        run: |
          set -euo pipefail
          bash tests/r51/docker_acceptance.sh 2>&1 | tee "$EVIDENCE_DIR/container-acceptance.log"
          grep -qE '^SUMMARY pass=[0-9]+ fail=0' "$EVIDENCE_DIR/container-acceptance.log"
      - name: Validate recorded image identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "--- image.txt ---"
          cat "$EVIDENCE_DIR/image.txt"
          test -s "$EVIDENCE_DIR/image-inspect.json"
          python3 - "$EVIDENCE_DIR" <<'PY'
          import json, sys
          root = sys.argv[1]
          image_id = open(root + "/image.txt").read().split("image_id=", 1)[1].splitlines()[0]
          inspect = json.load(open(root + "/image-inspect.json"))
          assert isinstance(inspect, list) and inspect, "image inspect is empty"
          assert inspect[0]["Id"] == image_id, (inspect[0]["Id"], image_id)
          assert inspect[0]["Os"] == "linux"
          print("image inspect OK", image_id, inspect[0]["Architecture"], inspect[0]["Config"]["User"])
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-acceptance-evidence-${{ github.run_id }}
          path: |
            container-evidence/
            self-test.log
          if-no-files-found: warn
