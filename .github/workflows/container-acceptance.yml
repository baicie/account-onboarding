# Manual-only container acceptance. It is NOT executed by this sprint (no push,
# no GitHub runner used); it exists so a maintainer can run the real Docker gate
# in a clean environment with one click.
name: container-acceptance
on:
  workflow_dispatch:
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Offline gates
        run: make verify
      - name: Docker runtime acceptance (isolated project/ports/data)
        shell: bash
        run: |
          set -euo pipefail
          docker info
          docker compose version
          docker compose -f deploy/compose.yaml config
          bash tests/r51/docker_acceptance.sh | tee container-acceptance.log
          grep -qE '^SUMMARY pass=[0-9]+ fail=0' container-acceptance.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-acceptance-evidence
          path: container-acceptance.log
          if-no-files-found: ignore
