# Manual-only container acceptance (R7). No push trigger, no deployment, no
# registry publish, no third-party platform credentials. Runs on a GitHub-hosted
# Ubuntu runner with the runner's Docker daemon.
name: container-acceptance
on:
  workflow_dispatch:
concurrency:
  group: container-acceptance
  cancel-in-progress: false
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/container-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Offline gates
        run: make verify
      - name: Docker acceptance script self-test (no daemon needed)
        shell: bash
        run: |
          set -euo pipefail
          bash tests/r51/docker_acceptance.sh --self-test | tee self-test.log
          grep -qE '^SUMMARY pass=[0-9]+ fail=0 mode=self-test' self-test.log
      - name: Docker environment evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            docker version
            docker info
            docker compose version
          } > "$EVIDENCE_DIR/docker-environment.txt" 2>&1
          docker compose -f deploy/compose.yaml config > "$EVIDENCE_DIR/compose-config.yaml"
          cat "$EVIDENCE_DIR/docker-environment.txt"
      - name: Docker runtime acceptance (isolated project/ports/data)
        shell: bash
        run: |
          set -euo pipefail
          bash tests/r51/docker_acceptance.sh 2>&1 | tee "$EVIDENCE_DIR/container-acceptance.log"
          grep -qE '^SUMMARY pass=[0-9]+ fail=0' "$EVIDENCE_DIR/container-acceptance.log"
      - name: Record image identity
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          IMG="$(grep -oE 'image=sha256:[0-9a-f]+' "$EVIDENCE_DIR/container-acceptance.log" 2>/dev/null | head -1 | cut -d= -f2 || true)"
          echo "image_id=$IMG" > "$EVIDENCE_DIR/image.txt"
          if [ -n "$IMG" ]; then docker image inspect "$IMG" > "$EVIDENCE_DIR/image-inspect.json" 2>&1 || true; fi
          echo "Image ID: ${IMG:-N/A (build did not complete)}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-acceptance-evidence-${{ github.run_id }}
          path: |
            container-evidence/
            self-test.log
          if-no-files-found: warn
