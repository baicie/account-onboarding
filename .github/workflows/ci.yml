name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build vet test-race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race -count=1

      - name: Provider contract tests
        run: go test ./internal/provider/... ./internal/mailx/... -race -count=1

      - name: Secret materializer tests
        run: bash tests/r15/secret_materialize.sh

      - name: Release preflight fail-closed tests
        run: bash tests/r18/release_preflight_test.sh

  formatting:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Check formatting
        run: |
          out="$(gofmt -l $(find cmd internal -name '*.go'))"
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

  compose-config:
    name: validate compose manifest (no daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: docker compose config
        run: docker compose -f deploy/compose.yaml config >/dev/null
