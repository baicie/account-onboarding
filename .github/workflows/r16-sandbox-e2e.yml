name: r16-sandbox-e2e

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - feat/r16-r17-final-sandbox-release-readiness
      - feat/r17-final-release-readiness
      - main

permissions:
  contents: read

jobs:
  sandbox-e2e:
    name: real keycloak + mailpit + onboardd + 5 identities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq lsof openssl curl ca-certificates
          command -v jq lsof openssl curl

      - name: Artifact policy tests
        run: bash tests/sandbox/artifact_allowlist_test.sh

      - name: Start real loopback sandbox
        env:
          MP_PLATFORM: linux-amd64
        run: bash tests/sandbox/up.sh

      - name: Sandbox infra five-identity gate
        run: bash tests/sandbox/verify.sh --count 5

      - name: Build real onboardd
        run: go build -trimpath -o "${RUNNER_TEMP}/onboardd" ./cmd/onboardd

      - name: Real application five-identity E2E
        env:
          ONBOARD_SANDBOX_E2E: "1"
          ONBOARD_BIN: ${{ runner.temp }}/onboardd
        run: go test ./tests/e2e -v -count=1 -timeout 900s

      - name: Collect only redacted evidence
        if: always()
        run: |
          rm -rf r16-evidence && mkdir -p r16-evidence
          i=0
          for f in .sandbox/e2e/run-*/evidence-*.json; do
            [ -f "$f" ] || continue
            i=$((i+1))
            cp "$f" "r16-evidence/evidence-$i-$(basename "$f")"
          done
          printf 'Sandbox app E2E evidence: %s test(s). Raw credentials, state DBs, admin tokens and logs are intentionally excluded.\n' "$i" > r16-evidence/summary.txt

      - name: Enforce artifact allowlist
        id: allowlist
        if: always()
        run: bash tests/sandbox/artifact_allowlist.sh r16-evidence

      - name: Upload sandbox evidence
        if: always() && steps.allowlist.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r16-sandbox-evidence
          path: r16-evidence
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop sandbox and purge test data
        if: always()
        run: bash tests/sandbox/down.sh --purge

      - name: Verify cleanup left no listeners or PIDs
        if: always()
        run: bash tests/sandbox/cleanup_check.sh
