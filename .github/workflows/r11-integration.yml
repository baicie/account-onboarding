name: r12-integration
# R12 acceptance-integrity gates: failure injection, Cloudflare HTTPS contract,
# and ARM64 runtime smoke. Isolated GitHub runner only.
on:
  push:
    branches: [feat/r12-acceptance-integrity, feat/r13-integration-reliability, feat/r14-security-release-closure, feat/r14-1-final-safety-closure]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r12-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: "1.26.10", cache: true}
      - name: First-install / failure / recovery drill
        env:
          R12_DEPLOY_REPORT: ${{ github.workspace }}/r12-evidence/deploy/report.json
        run: |
          set -uo pipefail
          mkdir -p r12-evidence/deploy
          set +e
          bash tests/r11/deploy_recovery.sh 2>&1 | tee r12-evidence/deploy/deploy.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -qE '^SUMMARY pass=[0-9]+ fail=0' r12-evidence/deploy/deploy.log
          exit "$rc"
      - name: Collect diagnostics
        if: always()
        run: docker ps -a > r12-evidence/deploy/docker-ps.txt 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: r12-deploy-recovery-evidence, path: r12-evidence/deploy/}
  cloudflare-mock-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: "1.26.10", cache: true}
      - name: Cloudflare HTTPS mock-live and stop conditions
        run: |
          set -uo pipefail
          mkdir -p r12-evidence/cloudflare
          set +e
          go test ./tests/r11 -run 'TestCloudflare' -v 2>&1 | tee r12-evidence/cloudflare/mock.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"
      - name: Cloudflare preflight dry-run/self-test
        run: |
          bash scripts/cloudflare_preflight.sh --self-test | tee r12-evidence/cloudflare/selftest.log
          ONBOARD_CF_TEST_ADDRESSES="r11-test@example.test" \
            bash scripts/cloudflare_preflight.sh --dry-run --test-address r11-test@example.test \
            | tee r12-evidence/cloudflare/dryrun.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: r12-cloudflare-mock-evidence, path: r12-evidence/cloudflare/}
  arm64-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Build linux/arm64 candidate
        run: |
          set -uo pipefail
          mkdir -p r12-evidence/arm64
          COMMIT="$(git rev-parse HEAD)"
          docker buildx create --use --name r12 >/dev/null 2>&1 || true
          set +e
          docker buildx build --platform linux/arm64 --build-arg VERSION=0.1.0 --build-arg COMMIT="$COMMIT" \
            -t onboarding-r12-arm64:test --load . > r12-evidence/arm64/build.log 2>&1
          rc=$?
          set -e
          if [ "$rc" != "0" ]; then echo "BUILD_FAIL"; cat r12-evidence/arm64/build.log; exit 1; fi
          echo "BUILD_PASS linux/arm64"
          ARCH="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' onboarding-r12-arm64:test)"
          echo "$ARCH" | tee r12-evidence/arm64/image.txt
          if [ "$ARCH" != "linux/arm64" ]; then echo "ARCH_FAIL expected linux/arm64 got $ARCH"; exit 1; fi
          if docker run --rm --platform linux/arm64 onboarding-r12-arm64:test version > r12-evidence/arm64/version.txt 2> r12-evidence/arm64/runtime.err; then
            echo "RUNTIME_VERSION_PASS linux/arm64" | tee -a r12-evidence/arm64/version.txt
            grep -q "commit $COMMIT" r12-evidence/arm64/version.txt
          else
            if grep -Eqi 'exec format error|qemu.*not found|no matching.*platform|operation not permitted' r12-evidence/arm64/runtime.err; then
              echo "RUNTIME_NOT_RUN: emulator unavailable; full service smoke not attempted" | tee -a r12-evidence/arm64/runtime.err
              exit 0
            fi
            echo "RUNTIME_FAIL linux/arm64" | tee -a r12-evidence/arm64/runtime.err
            cat r12-evidence/arm64/runtime.err
            exit 1
          fi
          # Full service smoke under QEMU: schema, secret read, readiness, run CRUD,
          # SIGTERM, restart and persistence.
          WORK="$(mktemp -d)"; NAME="onboard-r14-arm64-$$"; PORT="$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          cleanup_arm(){ docker rm -f "$NAME" >/dev/null 2>&1 || true; rm -rf "$WORK" 2>/dev/null || sudo -n rm -rf "$WORK" 2>/dev/null || true; }
          trap cleanup_arm EXIT
          mkdir -p "$WORK"/{data,secrets}
          head -c 32 /dev/urandom > "$WORK/secrets/master.key"
          head -c 32 /dev/urandom | base64 > "$WORK/secrets/admin.token"
          chmod 0400 "$WORK/secrets/"*
          TOKEN="$(cat "$WORK/secrets/admin.token")"
          sudo -n chown -R 10001:10001 "$WORK"
          docker run -d --name "$NAME" --platform linux/arm64 --user 10001:10001 --read-only             --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m             -p "127.0.0.1:$PORT:8788" -v "$WORK/data:/app/data" -v "$WORK/secrets:/run/secrets:ro"             -e ONBOARD_LISTEN=0.0.0.0:8788 -e ONBOARD_ALLOW_PUBLIC_LISTEN=1 -e ONBOARD_DB_PATH=/app/data/state.sqlite             -e ONBOARD_FAKE_PROVIDERS=true -e ONBOARD_DOMAINS=moonbyte.test             -e ONBOARD_MASTER_KEY_FILE=/run/secrets/master.key -e ONBOARD_ADMIN_TOKEN_FILE=/run/secrets/admin.token             onboarding-r12-arm64:test >/dev/null
          READY=0
          for _ in $(seq 1 90); do
            CODE="$(curl -sS -m 2 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/readyz" 2>/dev/null || true)"
            [ "$CODE" = "200" ] && { READY=1; break; }; sleep 1
          done
          if [ "$READY" != "1" ]; then echo "ARM64_SERVICE_NOT_READY"; docker logs "$NAME" 2>&1 | tail -30; exit 1; fi
          BODY='{"template":"sandbox-email-verify-oidc","mode":"sandbox-e2e","mailbox_provider":"fake-mailbox","identity_provider":"fake-identity","oauth_provider":"fake-oauth","sandbox_provider":"fake-sandbox"}'
          RUN_JSON="$(curl -sS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -H "Idempotency-Key: r14-arm64-1" -X POST "http://127.0.0.1:$PORT/v1/runs" -d "$BODY")"
          RUN="$(printf '%s' "$RUN_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("id",""))')"
          [ -n "$RUN" ] || { echo "ARM64_RUN_NOT_CREATED: $RUN_JSON"; exit 1; }
          docker stop -t 20 "$NAME" >/dev/null
          docker rm -f "$NAME" >/dev/null
          docker run -d --name "$NAME" --platform linux/arm64 --user 10001:10001 --read-only             --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m             -p "127.0.0.1:$PORT:8788" -v "$WORK/data:/app/data" -v "$WORK/secrets:/run/secrets:ro"             -e ONBOARD_LISTEN=0.0.0.0:8788 -e ONBOARD_ALLOW_PUBLIC_LISTEN=1 -e ONBOARD_DB_PATH=/app/data/state.sqlite             -e ONBOARD_FAKE_PROVIDERS=true -e ONBOARD_DOMAINS=moonbyte.test             -e ONBOARD_MASTER_KEY_FILE=/run/secrets/master.key -e ONBOARD_ADMIN_TOKEN_FILE=/run/secrets/admin.token             onboarding-r12-arm64:test >/dev/null
          READY=0
          for _ in $(seq 1 90); do
            CODE="$(curl -sS -m 2 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/readyz" 2>/dev/null || true)"
            [ "$CODE" = "200" ] && { READY=1; break; }; sleep 1
          done
          [ "$READY" = "1" ] || { echo "ARM64_RESTART_NOT_READY"; docker logs "$NAME" 2>&1 | tail -30; exit 1; }
          curl -sS -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/v1/runs/$RUN" | grep -q "$RUN" || { echo "ARM64_PERSISTENCE_FAILED"; exit 1; }
          echo "RUNTIME_SERVICE_PASS linux/arm64 schema=5 readyz=200 run=$RUN restart=persisted" | tee r12-evidence/arm64/service-smoke.txt
          cleanup_arm; trap - EXIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: r12-arm64-evidence, path: r12-evidence/arm64/}
