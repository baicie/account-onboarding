name: r22-arm64-full

on:
  push:
    branches: [feat/r22-product-first-final-acceptance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r22-arm64-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm64-full-emulated:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Register qemu binfmt handlers
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Set up buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3
      - name: QEMU availability evidence
        run: |
          set -euo pipefail
          docker run --rm --privileged tonistiigi/binfmt:latest --version || true
          docker run --rm --privileged tonistiigi/binfmt:latest --install arm64
      - name: Full ARM64 acceptance (all state changes inside the arm64 container)
        run: |
          set -euo pipefail
          bash tests/r22/arm64_full.sh --evidence-dir "$PWD/arm64-evidence" 2>&1 | tee arm64-full.log
          grep -q '^ARM64_FULL_EMULATED_PASS$' arm64-full.log
          grep -qE '^SUMMARY pass=[0-9]+ fail=0' arm64-full.log
      - name: Upload ARM64 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r22-arm64-full-evidence-${{ github.run_id }}
          path: |
            arm64-evidence/
            arm64-full.log
          if-no-files-found: warn
